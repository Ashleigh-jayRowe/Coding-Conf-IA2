<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review your music streaming annual plan order.">
    <title>Order Summary</title>
    <link rel="icon" type="image/png" href="images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="order-card">
        <img class="hero-image" src="images/illustration-hero.svg" alt="Illustration of a person enjoying music with headphones">

        <div class="order-content">
            <h1>Order Summary</h1>

            <p class="description">
                You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
            </p>

            <section class="plan" aria-label="Selected subscription plan">
                <img class="music-icon" src="images/icon-music.svg" alt="">
                <div class="plan-details">
                    <h2>Annual Plan</h2>
                    <p>$59.99/year</p>
                </div>
                <a class="change-link" href="#plan-options">Change</a>
            </section>

            <a class="payment-button" href="#payment">Proceed to Payment</a>
            <a class="cancel-link" href="#cancel">Cancel Order</a>
        </div>
    </main>
</body>
</html>
